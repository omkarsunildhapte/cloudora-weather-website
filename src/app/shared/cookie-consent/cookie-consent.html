@if (visible()) {
  <div
    class="fixed inset-x-0 bottom-[76px] md:bottom-0 z-50 px-4 pb-4 md:px-6 md:pb-6 animate-fade-in-up"
    role="dialog"
    aria-modal="false"
    aria-labelledby="cookie-consent-title"
  >
    <div class="consent-panel max-w-4xl mx-auto p-5 md:p-6">
      <div class="flex flex-col md:flex-row md:items-center gap-4 md:gap-6">
        <div class="min-w-0">
          <p id="cookie-consent-title" class="text-sm font-semibold text-white">
            Analytics on this website
          </p>
          <p class="text-xs md:text-sm text-gray-400 mt-1.5 leading-relaxed">
            We'd like to use Google Analytics to understand which pages people find useful. Nothing
            is stored until you accept, and the Cloudora Weather app itself stays analytics-free either
            way.
            <a
              routerLink="/privacy-policy"
              class="text-brand-primary hover:text-white transition-colors underline underline-offset-2"
              >Privacy Policy</a
            >
          </p>
        </div>
        <div class="flex items-center gap-3 shrink-0 md:ml-auto">
          <button
            type="button"
            (click)="decline()"
            class="flex-1 md:flex-none px-4 py-2.5 rounded-xl text-sm font-medium text-gray-300 border border-white/10 hover:bg-white/5 hover:text-white transition-colors"
          >
            Decline
          </button>
          <button
            type="button"
            (click)="accept()"
            class="consent-accept flex-1 md:flex-none px-5 py-2.5 rounded-xl text-sm font-semibold transition-colors"
          >
            Accept
          </button>
        </div>
      </div>
    </div>
  </div>
}
