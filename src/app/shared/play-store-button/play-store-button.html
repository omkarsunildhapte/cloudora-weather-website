<a
  [href]="url"
  target="_blank"
  rel="noopener"
  class="ps-link"
  [class.ps-primary]="variant() === 'primary'"
  [class.ps-secondary]="variant() === 'secondary'"
  [class.ps-compact]="variant() === 'compact'"
>
  <!-- fetchpriority: Lighthouse measures this badge as the LCP element on
       mobile — the sticky download bar puts it in the initial viewport, where
       it outranks the hero logo on area. It was already discoverable in the
       prerendered HTML and never lazy-loaded (both checks passed); the only
       failing item was the priority hint, without which the browser fetches
       it at default priority behind the CSS and JS. -->
  <img
    src="badges/google-play-badge.webp"
    alt="Get it on Google Play"
    class="ps-badge"
    width="646"
    height="250"
    fetchpriority="high"
  />
</a>
